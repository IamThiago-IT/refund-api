services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${PORT:-3333}:3333"
    env_file:
      - .env
    environment:
      # Must be 0.0.0.0 inside container to accept external connections
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: production
      # Override with .env values if set; defaults below are fallbacks
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DRIVE_DISK: ${DRIVE_DISK:-fs}
    volumes:
      # Persist SQLite DB and uploaded receipts
      - sqlite_data:/app/tmp
      - uploads_data:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3333/refunds"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Development with HMR (hot reload) ────────────────────────────────
  # Usage: docker compose --profile dev up
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${PORT:-3333}:3333"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - sqlite_data:/app/tmp
      - uploads_data:/app/storage
    command: npm run dev -- --host=0.0.0.0
    profiles:
      - dev

volumes:
  sqlite_data:
  uploads_data:
